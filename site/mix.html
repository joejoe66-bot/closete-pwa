<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#596347">
<title>CLOSETÉ — Rack view</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f1eb; --paper: #fffaf5; --ink: #252720; --olive: #596347;
  --line: #ddd1c4; --rose: #c9826a; --card-w: 140px; --card-h: 166px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: 'DM Sans', sans-serif; color: var(--ink); font-size: 17px;
  background: radial-gradient(ellipse at 50% -10%, #e7ded0 0, transparent 55%), var(--bg);
  min-height: 100vh; overflow-x: hidden;
  padding: calc(14px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom));
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

.wrap { max-width: 760px; margin: 0 auto; padding: 0 14px; }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
header a {
  text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--paper);
  border-radius: 30px; padding: 9px 14px; font-weight: 600; white-space: nowrap;
}
header h1 { font: 600 28px 'Playfair Display'; margin: 0; flex: 1; }
.badge { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--olive); }
.intro { margin: 4px 0 6px; line-height: 1.4; font-size: 15px; }

/* A rack is one row of clothes on a turning cylinder */
.rack { position: relative; margin: 6px 0 2px; }
.rack-head { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
.rack-head h2 { font-size: 16px; letter-spacing: 1.5px; text-transform: uppercase; margin: 0; }
.stage {
  position: relative; height: calc(var(--card-h) + 26px); perspective: 1100px;
  overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none;
  mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
}
.stage.dragging { cursor: grabbing; }
.rail { /* the clothes rail behind the hangers */
  position: absolute; left: 0; right: 0; top: 10px; height: 4px; border-radius: 2px;
  background: linear-gradient(#b8a993, #8d7f6b); opacity: .55;
}
.ring {
  position: absolute; left: 50%; top: 18px; width: var(--card-w); height: var(--card-h);
  margin-left: calc(var(--card-w) / -2); transform-style: preserve-3d;
}
.ring.snap { transition: transform .45s cubic-bezier(.2, .8, .25, 1); }
.slot {
  position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: #fff;
  border: 1px solid #e8ddd1; box-shadow: 0 10px 24px #4b3d2a1f;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transition: opacity .25s, filter .25s;
}
.slot img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.slot .ph { width: 100%; height: 100%; display: grid; place-items: center; font-size: 44px; color: #a69b8a; background: #eee5db; }
.slot .sample {
  position: absolute; left: 8px; top: 8px; font-size: 11px; font-weight: 700; letter-spacing: .5px;
  background: #fffaf5e6; border-radius: 10px; padding: 2px 7px;
}
.slot.front { box-shadow: 0 16px 34px #4b3d2a40; border-color: var(--olive); }

.arrow {
  position: absolute; top: calc(50% + 10px); transform: translateY(-50%); z-index: 3;
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: #fffaf5ee; font-size: 22px; line-height: 1; display: grid; place-items: center;
}
.arrow.prev { left: 4px; }
.arrow.next { right: 4px; }

.caption { text-align: center; min-height: 40px; margin-top: 0; }
.caption b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 30px; }
.caption span { font-size: 14px; }

.btn {
  flex: 1; display: grid; place-items: center; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line); background: var(--paper); border-radius: 30px;
  min-height: 54px; font-weight: 700; font-size: 18px;
}
.btn.primary { background: var(--olive); color: #fff; border-color: var(--olive); }

.slot.front { cursor: pointer; }
.count { font-size: 14px; font-weight: 600; }

.sheet-back {
  position: fixed; inset: 0; z-index: 20; display: none; align-items: flex-end; justify-content: center;
  background: #211e1b75; backdrop-filter: blur(4px);
}
.sheet-back.show { display: flex; }
.sheet {
  width: min(560px, 100%); max-height: 92dvh; overflow-y: auto; background: var(--paper);
  border-radius: 24px 24px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  animation: up .25s ease-out; scrollbar-width: none;
}
.sheet::-webkit-scrollbar { display: none; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.sheet-photos img { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 16px; background: #eee5db; }
.sheet h2 { font: 600 26px 'Playfair Display'; margin: 14px 0 6px; }
.sheet-meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 17px; }
.sheet-meta dt { font-weight: 700; }
.sheet-meta dd { margin: 0; }
.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
@media (min-width: 700px) {
  .sheet-back { align-items: center; }
  .sheet { border-radius: 24px; }
}

.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  opacity: 0; background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 30px;
  transition: .25s; pointer-events: none; z-index: 10; max-width: calc(100% - 30px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 700px) {
  :root { --card-w: 170px; --card-h: 200px; }
  header h1 { font-size: 34px; }
}

@media (prefers-reduced-motion: reduce) {
  .ring.snap { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="./">← Closet</a>
    <h1>Rack view</h1>
  </header>
  <p class="intro" id="intro">Swipe a rail left or right to turn it. Tap the piece in front to see it.</p>

  <div id="racks"><p class="intro">Loading your wardrobe…</p></div>
</div>

<div class="sheet-back" id="sheetBack">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName">
    <div class="sheet-photos" id="sheetPhotos"></div>
    <h2 id="sheetName"></h2>
    <div class="sheet-meta" id="sheetMeta"></div>
    <div class="sheet-actions">
      <a class="btn" id="sheetOpen" href="./">Open in closet</a>
      <button class="btn primary" id="sheetClose">Close</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  const API_URL_KEY = 'closete.apiUrl';
  const TOKEN_KEY = 'closete.token';
  const ITEMS_KEY = 'closete.items';
  const CATEGORIES = ['Tops', 'Bottoms', 'Outerwear', 'Dresses', 'Shoes', 'Accessories', 'Sportswear', 'Other'];

  const get = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const $ = s => document.querySelector(s);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const money = n => '$' + Number(n || 0).toLocaleString('en-SG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // Easy mode (長者模式) from the main app: Chinese labels and bigger text here too.
  const easy = get('closete.easy') === '1';
  const ZH = {
    'Tops': '上衣', 'Bottoms': '褲', 'Outerwear': '外套', 'Dresses': '裙', 'Shoes': '鞋',
    'Accessories': '配飾', 'Sportswear': '運動服', 'Other': '其他'
  };
  const T = t => (easy && ZH[t]) || t;

  function displayUrl(url) {
    const m = String(url || '').match(/^https:\/\/drive\.google\.com\/(?:uc|open|thumbnail)\?(?:.*&)?id=([\w-]{20,})/);
    return m ? 'https://lh3.googleusercontent.com/d/' + m[1] : String(url || '');
  }

  async function loadItems() {
    let items = [];
    try { items = JSON.parse(get(ITEMS_KEY) || '[]'); } catch (e) {}
    const url = get(API_URL_KEY), token = get(TOKEN_KEY);
    if (url && token && navigator.onLine) {
      try {
        const res = await fetch(url, {
          method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ token: token, action: 'getItems', payload: {} })
        }).then(r => r.json());
        if (res && res.ok && Array.isArray(res.data)) items = res.data;
      } catch (e) { /* keep the cached copy */ }
    }
    return items;
  }

  /* ---------- one turning rail ---------- */
  function makeRack(title, pieces, onPick) {
    const el = document.createElement('section');
    el.className = 'rack';
    el.innerHTML =
      '<div class="rack-head"><h2>' + esc(title) + '</h2><span class="count">' + pieces.length + (easy ? ' 件' : '') + '</span></div>'
      + '<div class="stage"><div class="rail"></div><div class="ring"></div>'
      + '<button class="arrow prev" aria-label="Previous">‹</button><button class="arrow next" aria-label="Next">›</button></div>'
      + '<div class="caption"><b></b><span></span></div>';
    const stage = el.querySelector('.stage');
    const ring = el.querySelector('.ring');

    // A cylinder needs enough faces to look round, so short lists repeat.
    const slots = [];
    for (let i = 0; slots.length < Math.max(10, pieces.length); i++) slots.push(pieces[i % pieces.length]);
    const n = slots.length;
    const step = 360 / n;

    ring.innerHTML = slots.map((p, i) =>
      '<div class="slot" data-i="' + i + '">'
      + (p.image ? '<img alt="" draggable="false" src="' + esc(p.image) + '">' : '<div class="ph">♧</div>')
      + '</div>').join('');
    const slotEls = Array.from(ring.children);
    slotEls.forEach(s => {
      const img = s.querySelector('img');
      if (img) img.addEventListener('error', () => { img.outerHTML = '<div class="ph">♧</div>'; });
    });

    let radius = 0, rot = 0;

    function layout() {
      const w = ring.offsetWidth || 122;
      radius = Math.round((w / 2 + 14) / Math.tan(Math.PI / n));
      slotEls.forEach((s, i) => { s.style.transform = 'rotateY(' + (i * step) + 'deg) translateZ(' + radius + 'px)'; });
      apply();
    }
    const index = () => ((Math.round(rot / step) % n) + n) % n;

    function apply() {
      ring.style.transform = 'translateZ(' + (-radius) + 'px) rotateY(' + (-rot) + 'deg)';
      const front = index();
      slotEls.forEach((s, i) => {
        const a = Math.abs(((i * step - rot) % 360 + 540) % 360 - 180);
        s.style.opacity = a > 75 ? 0 : String(1 - a / 110);
        s.classList.toggle('front', i === front);
      });
      const p = slots[front];
      el.querySelector('.caption b').textContent = p.name;
      el.querySelector('.caption span').textContent = [p.brand, p.color].filter(Boolean).join(' · ');
    }

    function snapTo(target) {
      ring.classList.add('snap');
      rot = target;
      apply();
      setTimeout(() => ring.classList.remove('snap'), 480);
    }
    const go = d => snapTo(Math.round(rot / step) * step + d * step);
    el.querySelector('.prev').addEventListener('click', e => { e.stopPropagation(); go(-1); });
    el.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); go(1); });

    // Drag / swipe to turn, with a little momentum. A tap (no movement) picks the front piece.
    let dragging = false, moved = 0, startX = 0, startRot = 0, lastX = 0, lastT = 0, vel = 0;
    stage.addEventListener('pointerdown', e => {
      if (e.target.closest('.arrow')) return;
      dragging = true; moved = 0; startX = lastX = e.clientX; startRot = rot; lastT = performance.now(); vel = 0;
      stage.classList.add('dragging'); ring.classList.remove('snap');
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener('pointermove', e => {
      if (!dragging) return;
      const degPerPx = step / ((ring.offsetWidth || 122) * 0.9);
      moved = Math.max(moved, Math.abs(e.clientX - startX));
      rot = startRot - (e.clientX - startX) * degPerPx;
      const now = performance.now();
      vel = (e.clientX - lastX) / Math.max(1, now - lastT) * degPerPx;
      lastX = e.clientX; lastT = now;
      apply();
    });
    const end = e => {
      if (!dragging) return;
      dragging = false; stage.classList.remove('dragging');
      if (moved < 6) {
        // Tap: the front piece opens; a side piece turns to the front.
        const hit = document.elementFromPoint(e.clientX, e.clientY);
        const slot = hit && hit.closest('.slot');
        if (slot && slot.classList.contains('front')) { snapTo(Math.round(rot / step) * step); onPick(slots[index()]); return; }
        if (slot) {
          let d = ((Number(slot.dataset.i) * step - rot) % 360 + 540) % 360 - 180;
          snapTo(rot + d);
          return;
        }
      }
      const fling = Math.max(-4, Math.min(4, Math.round(-vel * 180 / step)));
      snapTo(Math.round(rot / step) * step + fling * step);
    };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', () => { dragging = false; stage.classList.remove('dragging'); snapTo(Math.round(rot / step) * step); });

    return { el, layout };
  }

  /* ---------- detail sheet ---------- */
  function openSheet(p) {
    const photos = [p.image, p.labelImage].filter(Boolean);
    $('#sheetPhotos').innerHTML = photos.map(src => '<img alt="" src="' + esc(src) + '">').join('');
    $('#sheetName').textContent = p.name;
    const rows = [
      [easy ? '牌子' : 'Brand', p.brand], [easy ? '顏色' : 'Color', p.color], [easy ? '單位' : 'Unit', p.size],
      [easy ? '價錢' : 'Price', p.price ? money(p.price) : ''],
      [easy ? '著過' : 'Worn', p.wearCount ? (easy ? p.wearCount + ' 次' : p.wearCount + '×') : ''],
      [easy ? '備註' : 'Notes', p.notes]
    ].filter(r => r[1]);
    $('#sheetMeta').innerHTML = '<dl class="sheet-meta">' + rows.map(r => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl>';
    $('#sheetBack').classList.add('show');
  }
  const closeSheet = () => $('#sheetBack').classList.remove('show');
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetBack').addEventListener('click', e => { if (e.target === $('#sheetBack')) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  /* ---------- page ---------- */
  let racks = [];
  async function start() {
    if (easy) {
      document.documentElement.lang = 'zh-HK';
      document.body.style.fontSize = '20px';
      document.querySelector('header a').textContent = '← 衣櫃';
      document.querySelector('header h1').textContent = '轉衫架';
      $('#intro').textContent = '用手指左右撥，衣架就會轉。撳前面嗰件就睇得清楚。';
      $('#sheetOpen').textContent = '返衣櫃';
      $('#sheetClose').textContent = '關閉';
    }
    const items = await loadItems();
    const host = $('#racks');
    host.innerHTML = '';
    if (!items.length) {
      host.innerHTML = '<p class="intro">' + (get(TOKEN_KEY)
        ? (easy ? '衣櫃仲係空嘅。' : 'Your wardrobe is empty.')
        : (easy ? '請先喺 CLOSETÉ 連接衣櫃。' : 'Open CLOSETÉ on this device and connect first.')) + '</p>';
      return;
    }
    const cats = CATEGORIES.concat(Array.from(new Set(items.map(i => i.category))).filter(c => c && !CATEGORIES.includes(c)));
    racks = cats.map(cat => {
      const pieces = items.filter(i => (i.category || 'Other') === cat).map(i => ({
        name: i.name, brand: i.brand, color: i.color, size: i.size, price: Number(i.price || 0),
        wearCount: Number(i.wearCount || 0), notes: i.notes,
        image: displayUrl(i.imageUrl), labelImage: displayUrl(i.brandImageUrl)
      }));
      return pieces.length ? makeRack(T(cat), pieces, openSheet) : null;
    }).filter(Boolean);
    racks.forEach(r => host.appendChild(r.el));
    racks.forEach(r => r.layout());
  }

  window.addEventListener('resize', () => racks.forEach(r => r.layout()));
  start();
})();
</script>
</body>
</html>
